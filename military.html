<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="나와 가장 잘 맞는 군은? 육군 해군 공군 해병대 성향 테스트">
<title>나와 가장 잘 맞는 군은? | 심테연구소</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#202332;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{font-weight:900;font-size:20px}.logo span{color:#6c63ff}.home{font-size:13px;color:#777}
.box{background:white;border-radius:26px;padding:26px 20px;box-shadow:0 8px 28px rgba(25,30,60,.06)}h1{font-size:25px;margin:4px 0 9px}.sub{color:#777;font-size:13px;line-height:1.6;margin:0 0 24px}
.progress{height:7px;background:#ececf4;border-radius:99px;overflow:hidden;margin-bottom:25px}.bar{height:100%;width:0;background:#6c63ff;transition:.2s}
.qnum{font-size:12px;color:#6c63ff;font-weight:800;margin-bottom:8px}.question{font-size:19px;font-weight:800;line-height:1.45;margin-bottom:18px}.choices{display:grid;gap:10px}.choice{border:1px solid #e7e7ef;background:#fff;border-radius:15px;padding:16px;text-align:left;font-size:14px;cursor:pointer}.choice:hover{border-color:#6c63ff;background:#faf9ff}
.result{text-align:center}.result-icon{font-size:62px;margin:8px 0}.result h2{font-size:25px;margin:8px 0}.result p{color:#666;line-height:1.7;font-size:14px}.score{background:#f4f3ff;border-radius:17px;padding:14px;margin:18px 0;color:#555;font-size:13px}
.actions{display:grid;gap:10px;margin-top:22px}.btn{border:0;border-radius:15px;padding:15px;font-size:14px;font-weight:800;cursor:pointer}.primary{background:#6c63ff;color:white}.secondary{background:#f0f0f5;color:#444}.notice{font-size:11px;color:#aaa;line-height:1.6;text-align:center;margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#202332;color:white;padding:11px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="logo" href="/">심테<span>연구소</span></a><a class="home" href="/">홈으로</a></div>
<div class="box" id="app"></div>
<div class="notice">이 테스트는 재미와 오락을 위한 성향 테스트입니다. 실제 적성이나 군 복무 적합성을 판단하는 자료가 아닙니다.</div>
</div><div class="toast" id="toast"></div>
<script>
const questions=[
["갑자기 하루 일정이 바뀌었다. 나는?","일단 계획을 다시 짠다","상황을 보며 유연하게 움직인다","새로운 상황이 오히려 재밌다","일단 부딪혀 보고 해결한다"],
["여럿이 함께 움직일 때 나는?","전체 계획과 역할을 정리한다","사람들의 의견을 골고루 듣는다","분위기를 살리고 사람들을 챙긴다","필요하면 앞장서서 이끈다"],
["휴일에 가장 끌리는 것은?","새로운 곳을 돌아다니기","바다나 물가에서 쉬기","조용하고 편안하게 쉬기","활동적인 체험이나 운동"],
["문제가 생겼을 때 나의 스타일은?","원인을 분석하고 순서대로 해결","상황에 맞춰 차분히 대응","정보를 모으고 신중하게 판단","빠르게 결정하고 행동"],
["나는 어떤 환경에서 집중이 잘 될까?","규칙과 목표가 분명한 곳","변화가 있고 다양한 경험이 있는 곳","정돈되고 안정적인 곳","긴장감과 도전이 있는 곳"],
["친구가 나를 설명한다면?","책임감이 강하다","침착하고 차분하다","섬세하고 꼼꼼하다","추진력이 있다"],
["새로운 일을 맡았을 때 가장 먼저 하는 것은?","전체 계획부터 세운다","관련 정보를 찾아본다","실수하지 않게 하나씩 확인한다","일단 시작하고 배우면서 고친다"],
["경쟁 상황에서 나는?","준비한 만큼 해낸다","상대의 흐름을 읽는다","끝까지 집중력을 유지한다","승부욕이 강해진다"],
["여행을 간다면?","여러 장소를 알차게 돌아본다","바다와 자연을 즐긴다","숙소에서 여유롭게 쉬는 시간도 중요하다","액티비티를 최대한 많이 한다"],
["가장 듣기 좋은 말은?","믿고 맡길 수 있어","침착해서 든든해","꼼꼼하고 섬세해","추진력이 대단해"]
];
const types=[
{name:"육군",icon:"🪖",desc:"체계적으로 움직이면서도 다양한 상황에 적응하는 당신! 목표를 정하고 하나씩 해내는 힘이 강한 편이에요."},
{name:"해군",icon:"⚓",desc:"차분하게 상황을 읽고 넓게 바라보는 당신! 변화하는 환경에서도 침착함을 유지하는 편이에요."},
{name:"공군",icon:"✈️",desc:"꼼꼼하고 논리적으로 판단하는 당신! 정확성과 안정성을 중요하게 생각하는 성향이 강해요."},
{name:"해병대",icon:"🔴",desc:"도전과 실행을 좋아하는 당신! 결정이 빠르고 새로운 상황에서도 먼저 움직이는 추진력이 있어요."}
];
let scores=[0,0,0,0], current=0;
const app=document.getElementById("app");
function render(){
if(current<questions.length){
 const q=questions[current]; app.innerHTML=`<div class="qnum">QUESTION ${current+1} / ${questions.length}</div><div class="progress"><div class="bar" style="width:${(current/questions.length)*100}%"></div></div><div class="question">${q[0]}</div><div class="choices">${q.slice(1).map((x,i)=>`<button class="choice" onclick="answer(${i})">${x}</button>`).join("")}</div>`;
}else result();
}
function answer(i){scores[i]++;current++;render();}
function result(){
let max=Math.max(...scores), idx=scores.indexOf(max), t=types[idx];
app.innerHTML=`<div class="result"><div class="result-icon">${t.icon}</div><h2>나와 가장 잘 맞는 군은<br><strong>${t.name}</strong>!</h2><p>${t.desc}</p><div class="score">내 성향 점수 · 육군 ${scores[0]} / 해군 ${scores[1]} / 공군 ${scores[2]} / 해병대 ${scores[3]}</div><div class="actions"><button class="btn primary" onclick="shareResult('${t.name}')">📤 내 결과 공유하기</button><button class="btn secondary" onclick="location.reload()">↻ 다시 테스트하기</button></div></div>`;
}
async function shareResult(type){
 const url="https://military-test-h757.vercel.app/military.html";
 const message=`🪖 나와 가장 잘 맞는 군은?\n나는 ${type}과 가장 잘 맞는 유형!\n\n너도 테스트해봐!\n${url}`;
 const shareButton=document.querySelector(".actions .primary");
 if(shareButton) shareButton.disabled=true;
 try{
   const imageBlob=await makeResultImage(type,url);
   const imageFile=new File([imageBlob],"military-result.png",{type:"image/png"});
   const fileShareData={title:"나와 가장 잘 맞는 군은?",text:message,files:[imageFile]};
   if(navigator.share && navigator.canShare && navigator.canShare({files:[imageFile]})){
     await navigator.share(fileShareData);
     return;
   }
   if(navigator.share){
     await navigator.share({title:"나와 가장 잘 맞는 군은?",text:message,url:url});
     showToast("공유창을 열었어요. 결과 이미지는 기기에서 별도로 첨부해 주세요.");
     return;
   }
   downloadResultImage(imageBlob);
   showToast("이 브라우저는 바로 공유를 지원하지 않아 결과 이미지를 저장했어요.");
 }catch(e){
   if(e && e.name==="AbortError") return;
   if(navigator.share){
     try{
       await navigator.share({title:"나와 가장 잘 맞는 군은?",text:message,url:url});
       return;
     }catch(shareError){
       if(shareError && shareError.name==="AbortError") return;
     }
   }
   showToast("공유를 열지 못했어요. 크롬 또는 사파리에서 다시 시도해 주세요.");
 }finally{
   if(shareButton) shareButton.disabled=false;
 }
}
function makeResultImage(type,url){
 return new Promise((resolve,reject)=>{
   const canvas=document.createElement("canvas");
   canvas.width=1080; canvas.height=1350;
   const ctx=canvas.getContext("2d");
   const gradient=ctx.createLinearGradient(0,0,1080,1350);
   gradient.addColorStop(0,"#7168ff"); gradient.addColorStop(1,"#a69fff");
   ctx.fillStyle=gradient; ctx.fillRect(0,0,1080,1350);
   ctx.fillStyle="rgba(255,255,255,.16)"; ctx.beginPath(); ctx.roundRect(55,55,970,1240,48); ctx.fill();
   ctx.textAlign="center"; ctx.fillStyle="#ffffff";
   ctx.font="bold 54px sans-serif"; ctx.fillText("심테연구소",540,190);
   ctx.font="48px sans-serif"; ctx.fillText("나와 가장 잘 맞는 군은?",540,390);
   const icons={"육군":"🪖","해군":"⚓","공군":"✈️","해병대":"🔴"};
   ctx.font="150px sans-serif"; ctx.fillText(icons[type]||"⭐",540,650);
   ctx.font="bold 112px sans-serif"; ctx.fillText(type,540,825);
   ctx.font="42px sans-serif"; ctx.fillText("나의 성향 결과",540,930);
   ctx.font="34px sans-serif"; ctx.fillText("당신의 결과도 확인해 보세요!",540,1080);
   ctx.font="30px sans-serif"; ctx.fillText("테스트 링크는 공유 메시지에 함께 있어요",540,1190);
   canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("이미지 생성 실패")),"image/png");
 });
}
function downloadResultImage(blob){
 const link=document.createElement("a"); const objectUrl=URL.createObjectURL(blob);
 link.href=objectUrl; link.download="나의-군-성향-결과.png"; link.click();
 setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);
}
async function copyLink(){await copyText(location.href.split("#")[0]);showToast("테스트 링크를 복사했어요!");}
async function copyText(t){try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}}
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
render();
</script>
</body></html>
